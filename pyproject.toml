[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hbd-qkd-transfer"
version = "0.1.0"
description = "Hybrid quantum-classical data transfer with dynamic payload splitting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "pyyaml==6.0.2",
    "python-json-logger==3.3.0",
    "cryptography==49.0.0",
    "matplotlib==3.11.1",
    "plotly==6.9.0",
    "kaleido==1.3.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "mypy==1.10.0",
]

[project.scripts]
benchmark = "scripts.run_benchmark:main"
demo = "demo.backend.main:app"
generate-dashboard = "scripts.generate_dashboard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "E402"]
exclude = [".git", "__pycache__", "demo-frontend", "metrics/figures", "Project Report", "node_modules"]

[tool.ruff.isort]
known-first-party = ["classical", "demo", "metrics", "node", "quantum", "quantum_demo", "scripts", "server", "split_controller", "transmission"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["demo-frontend", "metrics/figures", "Project Report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"